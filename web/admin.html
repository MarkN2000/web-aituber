<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web AITuber | 管理</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body class="admin-page">
  <main class="admin-card">
    <p class="eyebrow">Web AITuber</p>
    <h1>管理画面</h1>
    <p class="lead">現在の回答状態の確認、中断、設定の再読み込みができます。</p>

    <dl class="admin-details">
      <div>
        <dt>状態</dt>
        <dd id="admin-status">サーバーへ接続中です</dd>
      </div>
      <div>
        <dt>質問</dt>
        <dd id="admin-question">—</dd>
      </div>
      <div>
        <dt>回答</dt>
        <dd id="admin-answer">—</dd>
      </div>
    </dl>

    <div class="admin-actions">
      <button id="skip" type="button" disabled>現在の回答を中断</button>
      <button id="reload-config" type="button">設定を再読み込み</button>
    </div>
    <p id="admin-config-status" class="status" role="status"></p>
    <p id="admin-error" class="status" role="alert"></p>
  </main>
  <script type="module" src="/static/js/admin.js?v=4"></script>
</body>
</html>
