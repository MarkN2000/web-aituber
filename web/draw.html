<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web AITuber | 絵・質問を送る</title>
    <meta name="theme-color" content="#f6f6f4">
    <link rel="manifest" href="draw/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/draw-180.png">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <link rel="stylesheet" href="/static/draw.css?v=16">
  </head>
  <body class="draw-page">
    <main class="draw-card">
      <div class="draw-tabs" role="tablist" aria-label="投稿方法">
        <button id="tab-draw" type="button" role="tab" aria-selected="true" aria-controls="panel-draw">絵を描く</button>
        <button id="tab-question" type="button" role="tab" aria-selected="false" aria-controls="panel-question" tabindex="-1">質問する</button>
      </div>

      <div id="panel-draw" class="draw-workspace" role="tabpanel" aria-labelledby="tab-draw">
        <section class="canvas-column" aria-label="描画キャンバス">
          <div class="drawing-surface">
            <canvas id="food-canvas" width="512" height="512" aria-label="食べ物を描くキャンバス"></canvas>
            <div id="draw-cursor" class="draw-cursor" data-tool="pen" aria-hidden="true" hidden>
              <span class="draw-cursor-ring"></span>
              <!-- Bootstrap Icons paint-bucket (MIT License) -->
              <svg class="draw-cursor-bucket" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6.192 2.78c-.458-.677-.927-1.248-1.35-1.643a3 3 0 0 0-.71-.515c-.217-.104-.56-.205-.882-.02-.367.213-.427.63-.43.896-.003.304.064.664.173 1.044.196.687.556 1.528 1.035 2.402L.752 8.22c-.277.277-.269.656-.218.918.055.283.187.593.36.903.348.627.92 1.361 1.626 2.068.707.707 1.441 1.278 2.068 1.626.31.173.62.305.903.36.262.05.64.059.918-.218l5.615-5.615c.118.257.092.512.05.939-.03.292-.068.665-.073 1.176v.123h.003a1 1 0 0 0 1.993 0H14v-.057a1 1 0 0 0-.004-.117c-.055-1.25-.7-2.738-1.86-3.494a4 4 0 0 0-.211-.434c-.349-.626-.92-1.36-1.627-2.067S8.857 3.052 8.23 2.704c-.31-.172-.62-.304-.903-.36-.262-.05-.64-.058-.918.219zM4.16 1.867c.381.356.844.922 1.311 1.632l-.704.705c-.382-.727-.66-1.402-.813-1.938a3.3 3.3 0 0 1-.131-.673q.137.09.337.274m.394 3.965c.54.852 1.107 1.567 1.607 2.033a.5.5 0 1 0 .682-.732c-.453-.422-1.017-1.136-1.564-2.027l1.088-1.088q.081.181.183.365c.349.627.92 1.361 1.627 2.068.706.707 1.44 1.278 2.068 1.626q.183.103.365.183l-4.861 4.862-.068-.01c-.137-.027-.342-.104-.608-.252-.524-.292-1.186-.8-1.846-1.46s-1.168-1.32-1.46-1.846c-.147-.265-.225-.47-.251-.607l-.01-.068zm2.87-1.935a2.4 2.4 0 0 1-.241-.561c.135.033.324.11.562.241.524.292 1.186.8 1.846 1.46.45.45.83.901 1.118 1.31a3.5 3.5 0 0 0-1.066.091 11 11 0 0 1-.76-.694c-.66-.66-1.167-1.322-1.458-1.847z"></path>
              </svg>
              <svg class="draw-cursor-eraser" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 21-4.3-4.3a2.3 2.3 0 0 1 0-3.2L13.4 2.8a2.3 2.3 0 0 1 3.2 0l4.6 4.6a2.3 2.3 0 0 1 0 3.2L11.8 20H7ZM5 11l9 9M22 21H7"></path>
              </svg>
            </div>
          </div>
          <p id="draw-status" class="status" role="status" aria-live="polite"></p>
        </section>

        <div class="tools-column">
          <div class="canvas-actions">
            <button id="submit-food" class="food-submit" type="button" disabled>食べてもらう</button>
            <button id="undo-canvas" class="secondary-button" type="button" title="1つ戻す (Ctrl/⌘+Z)" disabled>1つ戻す</button>
            <button id="clear-canvas" class="secondary-button" type="button" disabled>全消去</button>
          </div>
          <section class="draw-tools" aria-label="描画ツール">
            <div class="tool-switcher" role="group" aria-label="描画方法">
              <button class="secondary-button" type="button" data-draw-tool="pen" aria-pressed="true">ペン</button>
              <button class="secondary-button" type="button" data-draw-tool="bucket" aria-pressed="false">バケツ</button>
              <button class="secondary-button" type="button" data-draw-tool="eraser" aria-pressed="false">消しゴム</button>
            </div>

            <div class="brush-sizes" role="group" aria-label="線の太さ">
              <button class="secondary-button" type="button" data-brush-size="8" aria-label="細い" aria-pressed="false"><span class="brush-dot brush-dot-small"></span></button>
              <button class="secondary-button" type="button" data-brush-size="20" aria-label="普通" aria-pressed="true"><span class="brush-dot brush-dot-medium"></span></button>
              <button class="secondary-button" type="button" data-brush-size="40" aria-label="太い" aria-pressed="false"><span class="brush-dot brush-dot-large"></span></button>
            </div>

            <div class="color-shortcuts" role="group" aria-label="基本色">
              <button type="button" data-draw-color="#e85d3f" aria-label="赤" aria-pressed="true"></button>
              <button type="button" data-draw-color="#ef9138" aria-label="オレンジ" aria-pressed="false"></button>
              <button type="button" data-draw-color="#f2cf45" aria-label="黄色" aria-pressed="false"></button>
              <button type="button" data-draw-color="#55a868" aria-label="緑" aria-pressed="false"></button>
              <button type="button" data-draw-color="#4c7fc7" aria-label="青" aria-pressed="false"></button>
              <button type="button" data-draw-color="#8956ad" aria-label="紫" aria-pressed="false"></button>
              <button type="button" data-draw-color="#202020" aria-label="黒" aria-pressed="false"></button>
            </div>

            <canvas id="color-picker" class="color-picker" width="256" height="256" tabindex="0" aria-label="色相と彩度・明度。左右キーで色相、上下キーで明度、Shiftキーと上下キーで彩度を変更できます"></canvas>
          </section>
        </div>
      </div>
      <section id="panel-question" role="tabpanel" aria-labelledby="tab-question" hidden>
        <form id="submission-form" novalidate>
          <textarea id="text" name="text" aria-label="質問" maxlength="2000" required placeholder="AIキャラクターへの質問を入力してください" rows="4"></textarea>
          <p class="field-note"><span id="text-count">0</span> / 2000文字</p>
          <button id="submit-button" type="submit" disabled>質問を送る</button>
        </form>
        <p id="submission-status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/static/js/input.js?v=10"></script>
    <script type="module" src="/static/js/draw.js?v=22"></script>
  </body>
</html>
