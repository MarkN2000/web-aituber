<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web AITuber</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.3/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.3/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body class="main-page">
  <main id="stage">
    <canvas id="vrm-canvas" aria-label="VRMキャラクター表示"></canvas>
    <p id="viewer-message" hidden></p>
  </main>

  <section id="panel" aria-live="polite">
    <p id="status">表示開始を待っています</p>
    <p id="question"></p>
    <p id="answer"></p>
  </section>

  <aside class="main-input-panel">
    <p class="eyebrow">Web AITuber</p>
    <h1>質問する</h1>
    <form id="submission-form" class="compact-form" novalidate>
      <label for="text">質問</label>
      <textarea id="text" name="text" maxlength="2000" required placeholder="質問を入力してください" rows="3"></textarea>
      <p class="field-note"><span id="text-count">0</span> / 2000文字</p>

      <label for="image">画像（任意・1枚）</label>
      <input id="image" name="image" type="file" accept="image/*">

      <button id="submit-button" type="submit">質問を送る</button>
    </form>
    <p id="submission-status" class="status" role="status" aria-live="polite"></p>
  </aside>

  <section id="start-screen">
    <div id="start-card">
      <h1>Web AITuber</h1>
      <p>VRM表示と音声再生を開始します。</p>
      <button id="start" type="button">表示・音声を開始</button>
      <p id="start-error" role="alert"></p>
    </div>
  </section>

  <script type="module" src="/static/js/main.js?v=2"></script>
  <script type="module" src="/static/js/input.js?v=2"></script>
</body>
</html>
