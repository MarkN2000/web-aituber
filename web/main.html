<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web AITuber</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <link rel="stylesheet" href="/static/history.css?v=2">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.3/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.3/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body class="main-page">
  <main id="stage">
    <canvas id="vrm-canvas" aria-label="VRMキャラクター表示"></canvas>
    <p id="viewer-message" hidden></p>
  </main>

  <section id="conversation-history" class="conversation-history" aria-label="会話履歴" hidden>
    <div id="history-list" class="history-list" role="log" aria-live="polite"></div>
  </section>

  <div class="main-bottom">
    <section id="panel" aria-live="polite" hidden>
      <p id="status"></p>
      <p id="question"></p>
      <p id="answer"></p>
    </section>

    <p id="submission-status" class="composer-status" role="status" aria-live="polite"></p>

    <div id="image-preview" class="composer-attachment" hidden>
      <img id="image-thumbnail" alt="選択した画像のプレビュー">
      <span id="image-name"></span>
      <button id="image-remove" type="button" aria-label="選択した画像を解除">×</button>
    </div>

    <form id="submission-form" class="composer" novalidate>
      <button id="image-button" class="composer-icon-button" type="button" aria-label="画像を選択" title="画像を選択">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"></path>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="m5 17 4-4 3 3 2-2 5 5"></path>
        </svg>
      </button>
      <input id="image" name="image" type="file" accept="image/*" hidden>

      <label class="visually-hidden" for="text">質問</label>
      <input id="text" class="composer-input" name="text" type="text" maxlength="2000" required autocomplete="off" placeholder="質問を入力してください">
      <span id="text-count" class="visually-hidden">0</span>

      <button id="submit-button" class="composer-send-button" type="submit" aria-label="質問を送る" title="質問を送る">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3.5 4.5 17 7.5-17 7.5 3-7.5z"></path>
          <path d="M6.5 12h14"></path>
        </svg>
      </button>
    </form>
  </div>

  <section id="start-screen">
    <div id="start-card">
      <h1>Web AITuber</h1>
      <p>VRM表示と音声再生を開始します。</p>
      <button id="start" type="button">表示・音声を開始</button>
      <p id="start-error" role="alert"></p>
    </div>
  </section>

  <script type="module" src="/static/js/main.js?v=4"></script>
  <script type="module" src="/static/js/input.js?v=3"></script>
</body>
</html>
