<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web AITuber</title>
  <link rel="stylesheet" href="/static/style.css?v=1">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.3/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.3/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body class="display-page">
  <main id="stage">
    <canvas id="vrm-canvas" aria-label="VRMキャラクター表示"></canvas>
    <p id="viewer-message" hidden></p>
  </main>
  <section id="panel" aria-live="polite">
    <p id="status">表示開始を待っています</p>
    <p id="question"></p>
    <p id="answer"></p>
  </section>
  <button id="skip" type="button" disabled>回答を中断</button>
  <section id="start-screen">
    <div id="start-card">
      <h1>Web AITuber</h1>
      <p>音声の再生を許可して表示を開始します。</p>
      <button id="start" type="button">表示開始</button>
      <p id="start-error" role="alert"></p>
    </div>
  </section>
  <script type="module" src="/static/js/display.js"></script>
</body>
</html>
